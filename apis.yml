name: Fireglass
description: Fireglass was an Israeli browser-isolation cybersecurity startup, a portfolio company of
  Lightspeed Venture Partners, whose remote-browser-isolation product removed active web content threats
  by rendering pages in an isolated cloud environment. The company was acquired by Symantec in 2017 and
  its technology folded into Symantec Web Isolation (now part of Broadcom); it no longer operates as an
  independent brand. As of the 2026-07-19 enrichment probe the fireglass.com domain has been re-registered
  and now serves Technical Glass Products, an unrelated fire-rated architectural glass manufacturer. No
  surviving Fireglass developer portal, documentation, OpenAPI, MCP server, or /.well-known surface exists
  to enrich; this stub is retained as a resolved Lightspeed portfolio lead.
